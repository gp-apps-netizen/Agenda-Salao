<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a2e63">
<title>Salão • Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fh:'Fraunces',Georgia,serif;--fb:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--hw:600;--rk:1;--pill:999px;--tt:none;--ls:-.01em;--hero:#7a2e63;--on-hero:#fff;--bg:#f8f4f2;--surface:#fff;--surface2:#f3ecee;--ink:#2a1f27;--muted:#7b6b75;--line:#e9dfe3;--brand:#7a2e63;--brand2:#9c3f80;--brand-soft:#f4e6ef;--on-brand:#fff;--ok:#2f855a;--warn:#b7791f;--info:#2f6fb0;--bad:#c0392b;--off:#8a8a8a;--shadow:0 1px 2px rgba(42,31,39,.06),0 6px 20px rgba(42,31,39,.06);--r:calc(var(--rk) * 14px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141016;--surface:#1f1922;--surface2:#2a222e;--ink:#f4edf2;--muted:#a8989f;--line:#352c39;--brand:#d68cc0;--brand2:#e3a6d0;--brand-soft:#3a2536;--on-brand:#1c1119;--ok:#5fc08a;--warn:#e0b050;--info:#6aa7e6;--bad:#ef7a6c;--off:#8d8590;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#141016;--surface:#1f1922;--surface2:#2a222e;--ink:#f4edf2;--muted:#a8989f;--line:#352c39;--brand:#d68cc0;--brand2:#e3a6d0;--brand-soft:#3a2536;--on-brand:#1c1119;--ok:#5fc08a;--warn:#e0b050;--info:#6aa7e6;--bad:#ef7a6c;--off:#8d8590;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--fh);font-weight:var(--hw);margin:0;letter-spacing:var(--ls);text-transform:var(--tt)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-family:var(--fh);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px}
.logo{width:36px;height:36px;border-radius:calc(var(--rk) * 10px);background:var(--hero);color:var(--on-hero);display:grid;place-items:center;flex:none;overflow:hidden}
.logo.img{background:#fff;padding:2px}.logo.img.semfundo{background:transparent;padding:0}.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo-edit{display:flex;align-items:center;gap:14px}
.logo-prev{width:84px;height:84px;border-radius:calc(var(--rk) * 18px);background:var(--hero);color:var(--on-hero);display:grid;place-items:center;flex:none;overflow:hidden;border:1px solid var(--line)}
.logo-prev.img{background:#fff;padding:6px}.logo-prev.img.semfundo{background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface) 0 50%) 0 0/14px 14px;padding:0}.logo-prev img{width:100%;height:100%;object-fit:contain}.logo-prev svg{width:40px;height:40px}
.cores .custom{position:relative;width:30px;height:30px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;overflow:hidden;font-weight:700;color:var(--muted)}
.cores .custom input{position:absolute;inset:-6px;width:44px;height:44px;opacity:0;cursor:pointer}
.cores .custom.on{border:3px solid var(--ink)}
.prev-hero{border-radius:calc(var(--rk) * 14px);background:var(--hero);color:var(--on-hero);padding:14px;display:flex;align-items:center;gap:12px;margin-top:4px}
.prev-hero .logo{width:44px;height:44px;border-radius:calc(var(--rk) * 12px);background:rgba(255,255,255,.18)}
.prev-hero .logo.img{background:#fff}.prev-hero .logo.img.semfundo{background:transparent}
.prev-hero b{font-family:var(--fh);font-size:17px;display:block}.prev-hero small{opacity:.85}
.logo svg{width:22px;height:22px}
.view{max-width:760px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.txt-bad{color:var(--bad)!important;font-weight:600}
.cart{display:grid;grid-template-columns:1fr auto 76px 28px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rk) * 12px);padding:8px 10px;margin-bottom:6px}
.cart-n{min-width:0}.cart-n b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cart-n small{font-size:12px}
.cart-q{display:flex;align-items:center;gap:6px}.cart-q button{width:28px;height:28px;border-radius:calc(var(--rk) * 8px);border:1px solid var(--line);background:var(--surface2);font-weight:700}
.cart-q span{min-width:18px;text-align:center;font-weight:600}
.cart-p{width:100%;border:1px solid var(--line);border-radius:calc(var(--rk) * 8px);padding:6px;background:var(--surface);text-align:right;font-size:14px}
.cart-x{border:0;background:none;color:var(--bad);padding:0}.cart-x svg{width:18px;height:18px}
.bottom button{flex:1;max-width:120px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:500;position:relative;border-radius:calc(var(--rk) * 10px);min-width:0}
.bottom button.on{color:var(--brand)}
.bottom button.on svg{stroke-width:2.2}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:calc(var(--rk) * 9px);display:grid;place-items:center;padding:0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:10px}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sec-t h3{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--rk) * 12px);padding:11px 14px;font-weight:600;text-decoration:none;color:var(--ink);min-height:44px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.full{width:100%}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:calc(var(--rk) * 10px)}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .full2{grid-column:1/-1}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rk) * 10px);height:36px;min-width:36px;padding:0 10px;display:inline-grid;place-items:center;font-weight:600;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:7px 13px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--brand));flex:none}
.pill{font-size:11px;font-weight:600;border-radius:var(--pill);padding:3px 8px;white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.off{background:color-mix(in srgb,var(--off) 18%,transparent);color:var(--off)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
/* agenda */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.daynav .dlabel{flex:1;text-align:center;font-family:var(--fh);font-size:18px;background:none;border:0;padding:6px;position:relative}
.daynav input{position:absolute;inset:0;opacity:0;width:100%}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rk) * 12px);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.wd small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wd b{font-size:16px}
.wd i{font-style:normal;font-size:10px;font-weight:700;color:var(--brand);min-height:14px}
.wd.hj b{color:var(--brand)}
.wd.sel{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.wd.sel small,.wd.sel i,.wd.sel b{color:var(--on-brand)}
.banner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.banner b{color:var(--warn)}
.sum{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:4px 2px 8px}
.ag{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc,var(--brand));border-radius:var(--r);padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.ag-h{display:flex;flex-direction:column;min-width:46px}
.ag-h b{font-size:15px}.ag-h small{color:var(--muted);font-size:12px}
.ag-i{flex:1;min-width:0}
.ag-i b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-i span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag.bloq{border-left-color:var(--off);background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 8px,var(--surface2) 8px,var(--surface2) 16px)}
.ag.st-cancelado,.ag.st-faltou{opacity:.6}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:6px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;border-radius:calc(var(--rk) * 18px);border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 6px 20px rgba(122,46,99,.35)}
.fab svg{width:26px;height:26px}
@media(min-width:800px){.fab{right:calc(50% - 360px)}}
/* list rows */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow span{display:block;color:var(--muted);font-size:13px}
.row .r{text-align:right;font-weight:600;white-space:nowrap}
.row .r small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row.inativo{opacity:.55}
.av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px;overflow:hidden}
.av.foto{background:var(--surface2)}.av img,.avq img{width:100%;height:100%;object-fit:cover;display:block}
.avq{width:48px;height:48px;border-radius:calc(var(--rk) * 10px);background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none;overflow:hidden}
.foto-edit{display:flex;align-items:center;gap:14px}
.foto-prev{width:84px;height:84px;border-radius:calc(var(--rk) * 16px);background:var(--surface2);color:var(--muted);display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--line)}
.foto-prev.red{border-radius:50%}.foto-prev img{width:100%;height:100%;object-fit:cover}
.foto-grande{width:100%;aspect-ratio:1/1;max-height:260px;object-fit:cover;border-radius:var(--r);margin-bottom:12px;display:block}
.sh-av{display:flex;gap:12px;align-items:center}.sh-av .av{width:56px;height:56px;font-size:18px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rk) * 12px);padding:0 12px;margin-bottom:8px}
.search input{border:0;background:none;outline:0;padding:11px 0;flex:1;min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:calc(var(--rk) * 12px);padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:calc(var(--rk) * 10px);padding:8px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* forms */
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px 2px;text-transform:uppercase;letter-spacing:.03em}
.fld input:not([type=checkbox]):not([type=radio]),.fld select,.fld textarea,.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rk) * 12px);padding:11px 12px;outline:0;min-height:44px}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .fld{margin-bottom:12px}
.inline{display:flex;align-items:center;gap:8px;margin-top:8px}
.inline input{max-width:130px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--rk) * 10px);padding:8px 10px;font-weight:600;font-size:14px;min-width:62px}
.slot.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.opts{display:grid;gap:6px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:calc(var(--rk) * 12px);padding:11px 12px;background:var(--surface)}
.opt input{accent-color:var(--brand);width:18px;height:18px}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0}
.radios span{display:inline-block;border:1px solid var(--line);border-radius:var(--pill);padding:8px 14px;font-weight:600;font-size:14px;background:var(--surface)}
.radios input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cores{display:flex;gap:8px;flex-wrap:wrap}
.cores label{position:relative}
.cores input{position:absolute;opacity:0}
.cores span{display:block;width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.cores input:checked+span{border-color:var(--ink)}
.hrs{display:grid;gap:6px}
.hr{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start;border:1px solid var(--line);border-radius:calc(var(--rk) * 12px);padding:8px 10px}
.hr .d{display:flex;align-items:center;gap:6px;font-weight:600;padding-top:8px}
.hr .d input{accent-color:var(--brand);width:18px;height:18px}
.hr .t{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hr .t input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rk) * 9px);padding:7px 8px;font-size:14px}
.hr .t small{grid-column:1/-1;color:var(--muted);font-size:11px;margin-top:2px}
.hr.off .t{opacity:.35;pointer-events:none}
.itens .it{display:grid;grid-template-columns:1fr 70px 36px;gap:6px;margin-bottom:6px}
.itens select,.itens input{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rk) * 10px);padding:9px 8px;min-width:0}
.itens button{border:0;background:none;color:var(--bad)}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,18,.45);animation:fade .2s}
.sheet{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:22px;margin-bottom:4px}
.sheet .sub{color:var(--muted);margin-bottom:14px}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.x{border:0;background:var(--surface2);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-weight:500;text-align:right;word-break:break-word}
.note{background:var(--surface2);border-radius:calc(var(--rk) * 12px);padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-bottom:12px}
/* caixa */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.kpi b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.big{grid-column:1/-1;background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.kpi.big small{color:var(--on-brand);opacity:.85}
.kpi.big b{font-size:28px;font-family:var(--fh)}
.bars .b{margin-bottom:10px}
.bars .b div{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:10px}
.bars .b div span:last-child{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.bars .track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--brand);border-radius:4px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.n,table.t th.n{text-align:right}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;text-align:center}
.login-card .logo{width:64px;height:64px;border-radius:calc(var(--rk) * 18px);margin:0 auto 14px}
.login-card .logo svg{width:36px;height:36px}
.login-card .logo.img{width:104px;height:104px;border-radius:calc(var(--rk) * 26px);padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.12)}.login-card .logo.img.semfundo{padding:0;box-shadow:none}
.login{background:linear-gradient(180deg,color-mix(in srgb,var(--hero) 14%,var(--bg)),var(--bg) 55%)}
.login-card h1{font-size:26px}
.login-card form{text-align:left;margin-top:22px}

/* estilos */
.prev-hero{position:relative;overflow:hidden}.prev-hero>*{position:relative;z-index:1}
.prev-hero::before{content:"";position:absolute;inset:0;pointer-events:none}
:root[data-estilo=delicado] .prev-hero::before{background:radial-gradient(circle at 12% 22%,rgba(255,255,255,.18) 0 22px,transparent 23px),radial-gradient(circle at 90% 30%,rgba(255,255,255,.13) 0 36px,transparent 37px)}
:root[data-estilo=glamour] .prev-hero::before{inset:auto 10% 6px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent)}
:root[data-estilo=natural] .prev-hero::before{background:radial-gradient(ellipse at 0 100%,rgba(255,255,255,.14) 0 34%,transparent 35%)}
:root[data-estilo=rustico] .prev-hero::before{background:repeating-linear-gradient(178deg,rgba(0,0,0,.09) 0 2px,transparent 2px 9px,rgba(255,255,255,.04) 9px 10px,transparent 10px 17px)}
:root[data-estilo=moderno] .prev-hero::before{inset:auto 0 0 0;height:3px;background:var(--on-hero);opacity:.3}
:root[data-estilo=vintage] .prev-hero::before{inset:auto 0 0 0;height:8px;background:repeating-linear-gradient(135deg,#c0392b 0 8px,#fff 8px 16px,#1f3a5f 16px 24px,#fff 24px 32px)}
:root[data-estilo=vintage] .top{border-bottom:0;box-shadow:0 3px 0 0 transparent;background-image:linear-gradient(to top,transparent 0,transparent 100%)}
:root[data-estilo=vintage] .top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:repeating-linear-gradient(135deg,#c0392b 0 6px,#fff 6px 12px,#1f3a5f 12px 18px,#fff 18px 24px)}
:root[data-estilo=moderno] .brand b{font-size:20px}
.ambs{margin-bottom:10px}
.estilos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.est{position:relative}
.est input{position:absolute;opacity:0}
.est .c{display:block;border:1px solid var(--line);background:var(--surface);padding:10px 10px 12px;height:100%;cursor:pointer}
.est .c b{display:block;font-size:19px;line-height:1.15;margin-bottom:2px}
.est .c small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.est .c i{display:block;height:6px;margin-top:8px;border-radius:3px}
.est input:checked+.c{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.venc{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;border:1px solid}
.venc-aviso{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.venc-urgente{background:color-mix(in srgb,var(--warn) 20%,var(--surface));border-color:var(--warn)}
.venc-atraso{background:color-mix(in srgb,var(--bad) 13%,var(--surface));border-color:var(--bad)}
.venc-t{display:flex;gap:10px;align-items:flex-start}.venc-t>svg{margin-top:2px;flex:none}.venc-t>div{flex:1}
.venc-t b{display:block;font-size:14px}.venc-t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.venc-atraso .venc-t>svg{color:var(--bad)}.venc-aviso .venc-t>svg,.venc-urgente .venc-t>svg{color:var(--warn)}
.venc-x{border:0;background:none;color:var(--muted);padding:0}
.venc-b{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.venc-b:empty{display:none}.venc-b .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:calc(var(--rk) * 12px);font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.qr{display:grid;place-items:center;background:#fff;border-radius:calc(var(--rk) * 14px);padding:16px;margin:10px 0}
.linkbox{background:var(--surface2);border-radius:calc(var(--rk) * 10px);padding:10px 12px;font-size:13px;word-break:break-all;margin-bottom:10px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;margin:40px auto}
@keyframes rot{to{transform:rotate(360deg)}}
</style>

<body>
<div id="app"><div class="spin"></div></div>
<div id="sheet" class="sheet-wrap" hidden><div class="sheet-bg" data-act="fecharSheet"></div><div class="sheet"><div class="grip"></div><div id="sheetBody"></div></div></div>
<div id="toast"></div>
<script type="module">
import { firebaseConfig } from '../firebase-config.js';

const VERSAO = '2.1';
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const configurado = !!(firebaseConfig && firebaseConfig.apiKey && !/COLE/i.test(firebaseConfig.apiKey));

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoje = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDias = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const toMin = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const toHM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const fmtDia = s => parseYmd(s).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }).replace(/\./g, '');
const fmtBR = s => s ? String(s).split('-').reverse().join('/') : '';
const soDig = s => String(s || '').replace(/\D/g, '');
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const num = v => { v = String(v ?? '').trim().replace(/[R$\s]/g, ''); if (!v) return null; if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); const n = parseFloat(v); return isNaN(n) ? null : n; };
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fmtDur = m => { m = +m || 0; const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? pad(r) : ''}` : `${r} min`; };
const iniciais = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const telFmt = t => { const d = soDig(t); if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return t || ''; };
const waLink = (tel, msg) => { let n = soDig(tel); if (n && n.length <= 11) n = '55' + n; return `https://wa.me/${n}?text=${encodeURIComponent(msg)}`; };
const porNome = (a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR');
const porHora = (a, b) => (a.ini || '').localeCompare(b.ini || '');
const porDataHora = (a, b) => (a.data + a.ini).localeCompare(b.data + b.ini);

const ICON = {};
const P = {
  logo: '<circle cx="6.5" cy="17" r="3"/><circle cx="17.5" cy="17" r="3"/><path d="M8.6 14.8 18 3M15.4 14.8 6 3"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  users: '<circle cx="9" cy="8" r="3.6"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.8.7 2.8 2.4 3 5.2"/>',
  chart: '<path d="M3 20h18M6 16v-5M11 16V6M16 16v-8M21 16v-3"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  gear: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  l: '<path d="M15 18l-6-6 6-6"/>', r: '<path d="M9 18l6-6-6-6"/>',
  wa: '<path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.5L3.5 20.5l1.4-4.2a8.5 8.5 0 1 1 15.6-4.7z"/><path d="M9 8.6c.3 2.8 2.9 5.8 6 6.2l1-1.4-1.9-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-1.9z"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  edit: '<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/>',
  trash: '<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8C9 8 7 7 7 5.5S9 3 12 8zm0 0c3 0 5-1 5-2.5S15 3 12 8z"/>',
  cake: '<path d="M4 21h16v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7zM4 16.5c1.6 1 3.2 1 4.8 0s3.2-1 4.8 0 3.2 1 4.8 0M12 12V8.5"/><path d="M12 3.5c1 1 1 2.5 0 3-1-.5-1-2 0-3z"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  link: '<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1-1"/>',
  ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  money: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  share: '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  bag: '<path d="M5 8h14l-1.2 13H6.2L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
  box: '<path d="M3 7.5l9-4 9 4v9l-9 4-9-4v-9z"/><path d="M3 7.5l9 4 9-4M12 11.5v9"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/>',
};
for (const k in P) ICON[k] = `<svg class="i" viewBox="0 0 24 24">${P[k]}</svg>`;

const CFG_PADRAO = {
  nome: 'Meu Salão', whatsapp: '', endereco: '', instagram: '',
  online: true, intervalo: 30, antecedencia: 2, diasFrente: 30,
  msgConfirmacao: 'Olá, {cliente}! Seu horário no {salao} está confirmado ✅\n{servico} com {profissional}\n{data} às {hora}\n{endereco}',
  msgLembrete: 'Oi, {cliente}! Passando para lembrar do seu horário no {salao}: {servico} com {profissional}, {data} às {hora}. Podemos contar com você?',
  msgAniversario: 'Feliz aniversário, {cliente}! 🎉 Toda a equipe do {salao} deseja um dia lindo. Venha comemorar com a gente!',
};
const STATUS = {
  pendente: { t: 'Pendente', c: 'warn' }, confirmado: { t: 'Confirmado', c: 'info' },
  concluido: { t: 'Concluído', c: 'ok' }, faltou: { t: 'Faltou', c: 'bad' }, cancelado: { t: 'Cancelado', c: 'off' },
};
const OCUPA = new Set(['pendente', 'confirmado', 'concluido']);
const FORMAS = ['Pix', 'Dinheiro', 'Débito', 'Crédito'];
const CORES = ['#7a2e63', '#2f6fb0', '#2f855a', '#c05621', '#6b46c1', '#b83280', '#2c7a7b', '#975a16'];

/* ---------- estado ---------- */
const S = {
  pronto: false, user: null, cfg: { ...CFG_PADRAO },
  servicos: [], profs: [], pacotes: [], comissoes: {}, clientes: [], cpacotes: [], ags: [],
  tab: 'agenda', dia: hoje(), filtroProf: 'todos', cadTab: 'servicos',
  cliBusca: '', cliFiltro: 'todos', produtos: [], vendas: [], prodBusca: '', prodFiltro: 'ativos',
  rel: { per: 'mes', de: '', ate: '' }, relDados: null, relCarregando: false,
  janela: null, erro: null,
};
let db, auth, F, AU, unsubs = [], unsubAgs = null, unsubSalao = null;
const SUPER = 'godoygpx@gmail.com';   // administrador geral (painel Administrador Apps)
let SID = null;                        // salão deste login
const col = n => F.collection(db, 'saloes', SID, n);
const dref = (n, id) => F.doc(db, 'saloes', SID, n, id);

const servById = id => S.servicos.find(x => x.id === id);
const profById = id => S.profs.find(x => x.id === id);
const cliById = id => S.clientes.find(x => x.id === id) || (S.cliCache || {})[id];
/* clientes carregam só quando alguma tela precisa (economiza leituras ao abrir o app) */
let unsubCli = null, promCli = null;
function garantirClientes() {
  if (promCli) return promCli;
  promCli = new Promise(ok => {
    unsubCli = F.onSnapshot(col('clientes'), s => {
      S.clientes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(porNome); S.clientesOk = true; ok(); render();
      document.querySelectorAll('datalist[data-clis]').forEach(dl => dl.innerHTML = opcoesClientes(dl.dataset.clis === 'tel'));
    }, e => { console.error(e); ok(); });
  });
  return promCli;
}
const opcoesClientes = (tel = true) => S.clientes.map(c => `<option value="${esc(c.nome)}">${tel ? esc(telFmt(c.telefone)) : ''}</option>`).join('');
async function carregarCliente(id) {
  if (!id || cliById(id)) return cliById(id);
  try { const d = await F.getDoc(dref('clientes', id)); if (d.exists()) { (S.cliCache ||= {})[id] = { id, ...d.data() }; return S.cliCache[id]; } } catch (e) {}
  return null;
}
const agById = id => S.ags.find(x => x.id === id);
const nomeProf = a => profById(a.profId)?.nome || a.profNome || '—';
const profFaz = (p, sid) => !p.servicos || !p.servicos.length || p.servicos.includes(sid);
const restantes = cp => (cp.itens || []).reduce((s, i) => s + Math.max(0, (+i.qtd || 0) - (+i.usados || 0)), 0);
const cpAtivo = cp => restantes(cp) > 0 && (!cp.validade || cp.validade >= hoje());

function slotsLivres(p, dur, data, oc, step, minStart) {
  const h = (p.horarios || {})[parseYmd(data).getDay()];
  if (!h || !h.ativo) return [];
  const a = toMin(h.ini), b = toMin(h.fim);
  const pi = h.pIni && h.pFim ? toMin(h.pIni) : null, pf = h.pIni && h.pFim ? toMin(h.pFim) : null;
  const occ = oc.filter(o => o.profId === p.id).map(o => [toMin(o.ini), toMin(o.fim)]);
  step = Math.max(5, +step || 30); dur = Math.max(5, +dur || 30);
  const out = [];
  for (let t = a; t + dur <= b; t += step) {
    if (minStart != null && t < minStart) continue;
    if (pi != null && t < pf && t + dur > pi) continue;
    if (occ.some(([x, y]) => t < y && t + dur > x)) continue;
    out.push(toHM(t));
  }
  return out;
}
function preencher(tpl, a) {
  const p = a.profId ? nomeProf(a) : '';
  return String(tpl || '')
    .replaceAll('{cliente}', (a.clienteNome || '').split(' ')[0])
    .replaceAll('{servico}', a.servicoNome || '')
    .replaceAll('{profissional}', p)
    .replaceAll('{data}', a.data ? parseYmd(a.data).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' }) : '')
    .replaceAll('{hora}', a.ini || '')
    .replaceAll('{salao}', S.cfg.nome || '')
    .replaceAll('{endereco}', S.cfg.endereco || '')
    .replace(/\n{2,}/g, '\n').trim();
}

/* ---------- UI base ---------- */
const app = $('#app');
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
let sheetMount = null;
function openSheet(html, mount) {
  const w = $('#sheet');
  $('#sheetBody').innerHTML = html;
  if (w.hidden) { w.hidden = false; history.pushState({ sheet: 1 }, ''); document.body.style.overflow = 'hidden'; }
  $('.sheet').scrollTop = 0;
  sheetMount = mount || null;
  if (mount) mount($('#sheetBody'));
}
function hideSheet() { $('#sheet').hidden = true; $('#sheetBody').innerHTML = ''; document.body.style.overflow = ''; }
function closeSheet() { if ($('#sheet').hidden) return; if (history.state && history.state.sheet) history.back(); else hideSheet(); }
window.addEventListener('popstate', () => { if (!$('#sheet').hidden) hideSheet(); });
const head = (t, sub) => `<div class="sh-head"><div><h2>${t}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div><button class="x" data-act="fecharSheet" aria-label="Fechar">${ICON.x}</button></div>`;

function render() {
  if (S.user && S.acesso === 'ok' && S.tab === 'ajustes' && S.cfgSujo && document.getElementById('fCfg')) return;
  const ae = document.activeElement;
  const fid = ae && ae.id && app.contains(ae) ? ae.id : null;
  const pos = fid && 'selectionStart' in ae ? ae.selectionStart : null;
  if (!configurado) app.innerHTML = vSetup();
  else if (S.erro) app.innerHTML = `<div class="login"><div class="login-card"><h1>Ops</h1><p class="muted">${esc(S.erro)}</p><button class="btn pri" onclick="location.reload()">Tentar de novo</button></div></div>`;
  else if (!S.pronto) app.innerHTML = '<div class="spin"></div>';
  else if (!S.user) app.innerHTML = vLogin();
  else if (S.acesso === 'semSalao') app.innerHTML = vAviso('Login sem salão', 'Este e-mail não está vinculado a nenhum salão. Fale com o administrador do sistema.');
  else if (S.acesso === 'suspenso') app.innerHTML = vAviso('Acesso suspenso', 'O acesso deste salão está suspenso no momento. Seus dados continuam guardados. Fale com o administrador do sistema para reativar.');
  else if (S.acesso !== 'ok') app.innerHTML = '<div class="spin"></div>';
  else app.innerHTML = vShell();
  if (S.tab === 'ajustes' && document.getElementById('cfPrev')) previewTema();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} } }
}

function vSetup() {
  return `<div class="login"><div class="login-card"><div class="logo">${ICON.logo}</div><h1>Quase lá</h1>
  <p class="muted">Falta conectar o app ao seu projeto Firebase. Abra o arquivo <b>firebase-config.js</b> na raiz do repositório e cole a configuração do app web do Firebase. O passo a passo completo está no arquivo LEIAME.md.</p></div></div>`;
}
function vAviso(t, msg) {
  return `<div class="login"><div class="login-card"><div class="logo">${ICON.lock}</div><h1>${t}</h1><p class="muted">${msg}</p><p class="muted small">${esc(S.user?.email || '')}</p><button class="btn full" data-act="sairJa">Sair</button></div></div>`;
}
function vLogin() {
  const c = loginCfg || {};
  return `<div class="login"><div class="login-card"><div class="logo ${logoClasse(c)}">${logoHtml(c, ICON.logo)}</div><h1>${esc(c.nome || 'Agenda do Salão')}</h1><p class="muted">${c.nome ? 'Área do salão' : 'Entre com o login do seu salão'}</p>
  <form id="fLogin">
    <label class="fld"><span>E-mail</span><input id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="fld"><span>Senha</span><input id="lgSenha" type="password" autocomplete="current-password" required></label>
    <button class="btn pri full">Entrar</button>
    <button type="button" class="btn ghost full" data-act="esqueci" style="margin-top:6px">Esqueci a senha</button>
  </form><p class="muted small" style="margin-top:20px">v${VERSAO}</p></div></div>`;
}
function vShell() {
  const pend = S.ags.filter(a => a.status === 'pendente').length;
  const tabs = [['agenda', 'Agenda', 'cal', pend], ['clientes', 'Clientes', 'users'], ['caixa', 'Caixa', 'chart'], ['produtos', 'Produtos', 'bag'], ['cadastros', 'Cadastros', 'tag'], ['ajustes', 'Ajustes', 'gear']];
  const tit = { agenda: 'Agenda', clientes: 'Clientes', caixa: 'Caixa e relatórios', produtos: 'Produtos e estoque', cadastros: 'Serviços, pacotes e equipe', ajustes: 'Ajustes' }[S.tab];

/* ---------- aviso de vencimento da mensalidade do app ---------- */
function infoVencimento(t) {
  if (!t || t.plano === 'proprio' || !t.vencimento) return null;
  const hj = new Date(); hj.setHours(12, 0, 0, 0);
  const [y, m, d] = String(t.vencimento).split('-').map(Number);
  const dias = Math.round((new Date(y, m - 1, d, 12) - hj) / 864e5);
  const antes = +(t.cobranca && t.cobranca.dias) || 5;
  if (dias > antes) return null;
  const venc = `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}`;
  const valor = ((+t.mensalidade || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const txt = dias < 0 ? `A mensalidade do app venceu há ${-dias} dia${dias === -1 ? '' : 's'} (${venc})` : dias === 0 ? `A mensalidade do app vence hoje (${venc})` : `A mensalidade do app vence em ${dias} dia${dias === 1 ? '' : 's'} (${venc})`;
  return { dias, txt, valor, venc, nivel: dias < 0 ? 'atraso' : dias <= 1 ? 'urgente' : 'aviso', whats: (t.cobranca && t.cobranca.whats) || '', pix: (t.cobranca && t.cobranca.pix) || '', nome: t.nome || '' };
}
function linkAvisoPagamento(v) {
  let n = String(v.whats || '').replace(/\D/g, ''); if (n && n.length <= 11) n = '55' + n;
  const msg = `Olá! Estou enviando o pagamento da mensalidade do app de ${v.nome} (${v.valor}, vencimento ${v.venc}).`;
  return n ? `https://wa.me/${n}?text=${encodeURIComponent(msg)}` : '';
}
function avisoDispensado(chave) { try { return localStorage.getItem(chave) === new Date().toDateString(); } catch (e) { return false; } }
function dispensarAviso(chave) { try { localStorage.setItem(chave, new Date().toDateString()); } catch (e) {} }

function bannerVencimento() {
  if (S.suporte) return '';
  const v = infoVencimento({ ...(S.salao || {}), nome: S.cfg.nome || S.salao?.nome });
  if (!v || (v.nivel === 'aviso' && avisoDispensado('vencAviso:' + SID))) return '';
  const wa = linkAvisoPagamento(v);
  return `<div class="venc venc-${v.nivel}">
    <div class="venc-t">${ICON.clock}<div><b>${v.txt}</b><small>Valor ${v.valor}${v.nivel === 'atraso' ? ' · regularize para não ter o acesso suspenso' : ''}</small></div>${v.nivel === 'aviso' ? `<button class="venc-x" data-act="dispensarVenc" aria-label="Fechar">${ICON.x}</button>` : ''}</div>
    <div class="venc-b">${v.pix ? `<button class="btn sm" data-act="copiarPix" data-pix="${esc(v.pix)}">${ICON.copy}Copiar chave Pix</button>` : ''}${wa ? `<a class="btn sm wa" href="${wa}" target="_blank" rel="noopener">${ICON.wa}Avisar pagamento</a>` : ''}</div>

}

async function vincularCliente(nome, tel, criar = true) {
  await garantirClientes();
  const d = soDig(tel);
  let c = d.length >= 8 ? S.clientes.find(x => soDig(x.telefone) === d) : null;
  if (!c && nome) c = S.clientes.find(x => norm(x.nome) === norm(nome) && (!d || !soDig(x.telefone)));
  if (c) {
    if (d && !soDig(c.telefone)) await F.updateDoc(dref('clientes', c.id), { telefone: tel });
    return c.id;
  }
  if (!criar || !nome) return '';
  const ref = F.doc(col('clientes'));
  const novo = { nome: nome.trim(), telefone: tel || '', nascimento: '', obs: '', criadoEm: F.serverTimestamp() };
  await F.setDoc(ref, novo);
  S.clientes.push({ id: ref.id, ...novo });
  return ref.id;
}
async function mudarStatus(id, st, extra = {}) {
  const a = agById(id); if (!a) return;
  const b = F.writeBatch(db);
  b.update(dref('agendamentos', id), { status: st, ...extra });
  if (OCUPA.has(st)) b.set(dref('ocupados', id), { data: a.data, profId: a.profId, ini: a.ini, fim: a.fim });
  else b.delete(dref('ocupados', id));
  await b.commit();
  Object.assign(a, { status: st, ...extra });
}
async function devolverSessao(a) {
  if (!a.pacoteClienteId) return;
  const r = dref('clientePacotes', a.pacoteClienteId);
  await F.runTransaction(db, async tx => {
    const s = await tx.get(r); if (!s.exists()) return;
    const itens = s.data().itens || [];
    const it = itens.find(i => i.servicoId === a.servicoId && i.usados > 0);
    if (it) { it.usados--; tx.update(r, { itens }); }
  });
}

    const dados = { data: d, ini, fim, profId: p.id, profNome: p.nome, servicoId: s.id, servicoNome: s.nome, valor: num($('#agValor').value) ?? (+s.preco || 0), clienteId: cid || '', clienteNome: nome, telefone: tel, obs: $('#agObs').value.trim(), tipo: 'normal' };

/* ---------- CAIXA ---------- */
function periodo() {
  const h = hoje(), d = new Date();
  switch (S.rel.per) {
    case 'hoje': return [h, h];
    case '7d': return [addDias(h, -6), h];
    case 'mes': return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), h];
    case 'mesAnt': return [ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)), ymd(new Date(d.getFullYear(), d.getMonth(), 0))];
    default: return [S.rel.de || h, S.rel.ate || h];
  }
}
async function carregarRel() {
  const [de, ate] = periodo();
  S.relCarregando = true; render();
  try {
    const faixa = (c, campo) => F.getDocs(F.query(col(c), F.where(campo, '>=', de), F.where(campo, '<=', ate)));
    const [s1, s2, s3, s4, s5] = await Promise.all([faixa('agendamentos', 'data'), faixa('agendamentos', 'pagoEm'), faixa('vendas', 'data'), faixa('movimentos', 'data'), faixa('clientePacotes', 'data')]);
    const m = new Map(); [...s1.docs, ...s2.docs].forEach(d => m.set(d.id, { id: d.id, ...d.data() }));
    const lst = sn => sn.docs.map(d => ({ id: d.id, ...d.data() }));
    S.relDados = { de, ate, ags: [...m.values()], vprod: lst(s3), movs: lst(s4), cpsPer: lst(s5) };
  } catch (e) { console.error(e); toast('Erro ao carregar relatório'); S.relDados = { de, ate, ags: [], vprod: [], movs: [] }; }
  S.relCarregando = false; render();
}
function calcRel() {
  const { de, ate, ags } = S.relDados, vprod = S.relDados.vprod || [], movs = S.relDados.movs || [];
  const noPer = x => x >= de && x <= ate;
  const todos = ags.filter(a => a.tipo !== 'bloqueio');
  const at = todos.filter(a => noPer(a.data));                       // agenda do período (faltas, cancelados, pedidos)
  const conc = todos.filter(a => a.status === 'concluido' && noPer(a.pagoEm || a.data));   // caixa: pelo dia do pagamento
  const vendas = S.relDados.cpsPer || S.cpacotes.filter(cp => cp.data >= de && cp.data <= ate);
  const recServ = conc.reduce((s, a) => s + (+a.valorCobrado || 0), 0);
  const recPac = vendas.reduce((s, cp) => s + (+cp.valor || 0), 0);
  const formas = {};
  conc.filter(a => a.formaPg !== 'Pacote').forEach(a => formas[a.formaPg || 'Outro'] = (formas[a.formaPg || 'Outro'] || 0) + (+a.valorCobrado || 0));
  vendas.forEach(cp => formas[cp.formaPg || 'Outro'] = (formas[cp.formaPg || 'Outro'] || 0) + (+cp.valor || 0));

  const falta = carrinho.filter(i => i.qtd > (+prodById(i.produtoId)?.estoque || 0));
  if (falta.length && !confirm(`Estoque insuficiente de ${falta.map(i => prodById(i.produtoId)?.nome).join(', ')}. Registrar a venda mesmo assim?`)) return;
  const sub = carrinho.reduce((s, i) => s + i.qtd * (+i.preco || 0), 0), desc = r2(Math.min(sub, num($('#vpDesc').value) || 0));
  await garantirClientes();
  const cliNome = $('#vpCli').value.trim(), cli = S.clientes.find(c => norm(c.nome) === norm(cliNome));
  const vend = profById($('#vpVend').value), forma = document.querySelector('[name=vpForma]:checked')?.value || 'Pix';
  form.querySelector('button.pri').disabled = true;
  try {
    await F.runTransaction(db, async tx => {
      const ids = [...new Set(carrinho.map(i => i.produtoId))], snaps = {};
      for (const id of ids) snaps[id] = (await tx.get(dref('produtos', id))).data();
      const itens = carrinho.map(i => ({ produtoId: i.produtoId, nome: snaps[i.produtoId]?.nome || '', qtd: i.qtd, preco: r2(+i.preco || 0), custo: r2(+snaps[i.produtoId]?.custo || 0) }));
      const vref = F.doc(col('vendas')), h = agoraHM();
      for (const id of ids) {
        const q = itens.filter(i => i.produtoId === id).reduce((s, i) => s + i.qtd, 0);
        tx.update(dref('produtos', id), { estoque: (+snaps[id]?.estoque || 0) - q });
        tx.set(F.doc(col('movimentos')), { tipo: 'venda', vendaId: vref.id, produtoId: id, produtoNome: snaps[id]?.nome || '', qtd: -q, custoUnit: +snaps[id]?.custo || 0, data: hoje(), hora: h, obs: cliNome });
      }
      tx.set(vref, { data: hoje(), hora: h, itens, subtotal: r2(sub), desconto: desc, total: r2(sub - desc), custoTotal: r2(itens.reduce((s, i) => s + i.qtd * i.custo, 0)), formaPg: forma, clienteId: cli?.id || '', clienteNome: cliNome, vendedorId: vend?.id || '', vendedorNome: vend?.nome || '', criadoEm: F.serverTimestamp() });

let fotoTmp = undefined;   // undefined = não mexeu; '' = removida; 'data:…' = nova
async function prepararFoto(file, max = 320, limite = 60000) {
  const url = URL.createObjectURL(file), img = new Image(); img.src = url; await img.decode();
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  const lado = Math.min(W, H), sx = (W - lado) / 2, sy = (H - lado) / 2, t = Math.min(max, lado);   // recorte quadrado central
  const c = document.createElement('canvas'); c.width = c.height = t;
  c.getContext('2d').drawImage(img, sx, sy, lado, lado, 0, 0, t, t); URL.revokeObjectURL(url);
  let q = .85, out = c.toDataURL('image/webp', q);
  if (!out.startsWith('data:image/webp')) { q = .85; out = c.toDataURL('image/jpeg', q); }
  const tipo = out.startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';
  while (out.length > limite && q > .35) { q -= .12; out = c.toDataURL(tipo, q); }
  return out;
}

async function prepararLogo(file) {
  const url = URL.createObjectURL(file), img = new Image(); img.src = url; await img.decode();
  const max = 360, r = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const w = Math.max(1, Math.round((img.naturalWidth || img.width) * r)), h = Math.max(1, Math.round((img.naturalHeight || img.height) * r));
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
  let q = .9, out = c.toDataURL('image/webp', q);
  if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
  while (out.length > 250000 && q > .35) { q -= .15; out = c.toDataURL('image/webp', q); }
  return out;
}

  const mapa = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  const L = (ref, fn) => unsubs.push(F.onSnapshot(ref, s => { fn(s); render(); }, e => { console.error(e); if (e.code === 'permission-denied') toast('Sem permissão: confira as regras do Firestore'); }));
  L(col('servicos'), s => S.servicos = mapa(s).sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '') || porNome(a, b)));
  L(col('profissionais'), s => S.profs = mapa(s).sort(porNome));

  L(dref('privado', 'comissoes'), s => S.comissoes = s.exists() ? s.data() : {});

const SLUG = (new URLSearchParams(location.search).get('s') || '').trim();

function guardarAparencia(sid, cfg) { try { const a = { sid }; CAMPOS_AP.forEach(k => { if (cfg[k] !== undefined) a[k] = cfg[k]; }); localStorage.setItem(CHAVE_AP, JSON.stringify(a)); } catch (e) {} }
